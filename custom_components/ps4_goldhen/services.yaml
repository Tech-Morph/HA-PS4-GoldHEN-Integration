send_payload:
  name: Send Payload
  description: >-
    Stream a .bin or .elf payload file to the PS4 GoldHEN BinLoader over TCP.
    Successful transfer does not confirm execution or firmware compatibility.
    The file must be inside /config/ps4/payloads/, and it can only go to a console set up in this integration.
  fields:
    payload_file:
      name: Payload File
      description: >-
        File name (e.g. goldhen.bin or payload.elf) of a file directly inside /config/ps4/payloads/. Paths and ".." are refused.
      required: true
      example: goldhen.bin
      selector:
        text:
    ps4_host:
      name: PS4 Host (optional)
      description: IP of the console to send to; it must be one set up in this integration. Without it, the first console set up is used.
      required: false
      example: 192.168.1.100
      selector:
        text:
    binloader_port:
      name: BinLoader Port (optional)
      description: Ignored. The port always comes from the chosen console's entry; kept so existing calls still work.
      required: false
      example: 9090
      selector:
        number:
          min: 1024
          max: 65535
          mode: box
    timeout:
      name: Timeout (seconds)
      description: TCP connect/drain timeout per operation, not a whole-transfer deadline. Default is 30.
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 300
          mode: box
